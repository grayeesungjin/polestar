<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>주행 데이터 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: #101216;
    color: #e8e8ea;
    padding: 16px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  /* 메인 컨테이너: 태블릿 이상에서 2열 */
  .main-container {
    display: grid;
    gap: 16px;
  }
  @media (min-width: 768px) {
    .main-container {
      grid-template-columns: 1fr 1.2fr;
    }
  }
  
  /* 왼쪽 영역 */
  .left-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  /* 오른쪽 영역 */
  .right-section {
    background: #1a1d24;
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
  }
  
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  @media (min-width: 768px) {
    .cards {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  .card { background: #1a1d24; border-radius: 10px; padding: 12px; }
  .card .label { font-size: 0.75rem; color: #9a9ea8; margin-bottom: 4px; }
  .card .value { font-size: 1.3rem; font-weight: 600; }
  .chart-wrap { background: #1a1d24; border-radius: 10px; padding: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid #262a33; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #9a9ea8; font-weight: 500; }
  .open-badge { color: #4ade80; font-size: 0.7rem; }
  #status { font-size: 0.8rem; color: #9a9ea8; margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>🚗 주행 데이터 대시보드</h1>
  <div id="status">불러오는 중...</div>

  <div class="main-container">
    <!-- 왼쪽: 카드 + 차트 -->
    <div class="left-section">
      <div class="cards" id="summaryCards"></div>

      <div class="chart-wrap">
        <canvas id="trendChart" height="140"></canvas>
      </div>
    </div>

    <!-- 오른쪽: 테이블 -->
    <div class="right-section">
      <table>
        <thead>
          <tr><th>날짜</th><th>거리(km)</th><th>전비(Wh/km)</th><th>평균속도(km/h)</th><th>소요시간(분)</th></tr>
        </thead>
        <tbody id="tripsBody"></tbody>
      </table>
    </div>
  </div>

<script>
async function load() {
  const statusEl = document.getElementById('status');
  try {
    const [tripsRes, dailyRes] = await Promise.all([
      fetch('/api/trips?limit=30'),
      fetch('/api/daily?days=30'),
    ]);
    const trips = (await tripsRes.json()).trips;
    const daily = (await dailyRes.json()).daily;

    renderSummary(trips);
    renderTrend(daily);
    renderTable(trips);
    statusEl.textContent = `최근 트립 ${trips.length}개, ${new Date().toLocaleTimeString('ko-KR')} 기준`;
  } catch (e) {
    statusEl.textContent = '데이터를 불러오지 못했습니다: ' + e.message;
  }
}

function renderSummary(trips) {
  const closed = trips.filter(t => !t.open);
  const totalKm = closed.reduce((s, t) => s + t.distanceKm, 0);
  const totalWh = closed.reduce((s, t) => s + t.energyWh, 0);
  const avgWhKm = totalKm > 0 ? totalWh / totalKm : null;

  const cards = [
    ['최근 트립 수', trips.length],
    ['누적 거리(km)', totalKm.toFixed(1)],
    ['평균 전비(Wh/km)', avgWhKm != null ? avgWhKm.toFixed(0) : '-'],
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(([label, value]) => `
    <div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>
  `).join('');
}

let chart;
function renderTrend(daily) {
  const ctx = document.getElementById('trendChart').getContext('2d');
  const labels = daily.map(d => d.day);
  const consumption = daily.map(d => d.avgConsumptionWhKm);
  const distance = daily.map(d => d.distanceKm);

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { type: 'bar', label: '거리(km)', data: distance, backgroundColor: '#2c3550', yAxisID: 'y1' },
        { type: 'line', label: '전비(Wh/km)', data: consumption, borderColor: '#4ade80', backgroundColor: '#4ade80', yAxisID: 'y2', tension: 0.3 },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y1: { position: 'left', title: { display: true, text: 'km' }, grid: { color: '#262a33' } },
        y2: { position: 'right', title: { display: true, text: 'Wh/km' }, grid: { drawOnChartArea: false } },
        x: { grid: { color: '#262a33' } },
      },
      plugins: { legend: { labels: { color: '#e8e8ea' } } },
    },
  });
}

function renderTable(trips) {
  document.getElementById('tripsBody').innerHTML = trips.map(t => `
    <tr>
      <td>${new Date(t.start).toLocaleString('ko-KR')} ${t.open ? '<span class="open-badge">● 주행중</span>' : ''}</td>
      <td>${t.distanceKm ?? '-'}</td>
      <td>${t.avgConsumptionWhKm ?? '-'}</td>
      <td>${t.avgSpeedKmh ?? '-'}</td>
      <td>${t.durationMin ?? '-'}</td>
    </tr>
  `).join('');
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
